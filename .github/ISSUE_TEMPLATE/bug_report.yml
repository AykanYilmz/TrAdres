name: Bug report / Hata bildirimi
description: A crash, a wrong error message or broken behaviour. For a wrong parsing result, use the address form.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not share real addresses or personal data, also not in logs or sample files.**
        **Gerçek adres veya kişisel veri paylaşmayın; loglar ve örnek dosyalar da buna dahil.**
  - type: textarea
    id: what
    attributes:
      label: What happened? / Ne oldu?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it / Tekrar üretme adımları
      description: The smallest code or command that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output / Hata çıktısı
      render: text
  - type: input
    id: version
    attributes:
      label: TrAdres version / Sürüm
      description: The output of `tradres --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system / Python ve işletim sistemi
      placeholder: "Python 3.12, Windows 11"
    validations:
      required: true
